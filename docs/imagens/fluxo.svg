<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#245b49" stroke-width="1.6"/></marker></defs><rect width="1240" height="880" fill="#f8f8f3"/><style>text{font-family:Arial,sans-serif;fill:#173e31}.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.muted{fill:#52675c}.line{fill:none;stroke:#245b49;stroke-width:2.2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><text x="35" y="48" class="title">Consulta Câmara · workflow publicado</text><text x="35" y="79" class="body muted">Grafo consultado no endpoint /grafo · anotações sobre as responsabilidades de cada etapa</text><rect x="365" y="110" width="470" height="72" rx="12" fill="#f1f2e8" stroke="#9ab5a3"/><text x="383" y="141" class="head">Mensagem do usuário</text><text x="383" y="170" class="body">Chat → FastAPI /chat</text><rect x="365" y="214" width="470" height="98" rx="12" fill="#e7efe8" stroke="#9ab5a3"/><text x="383" y="245" class="head">1. Planejar · IA generativa</text><text x="383" y="274" class="body">Pergunta + contexto + catálogo + prompt</text><text x="383" y="297" class="body">GPT-5.4 produz um plano JSON</text><rect x="365" y="350" width="470" height="98" rx="12" fill="#e7efe8" stroke="#9ab5a3"/><text x="383" y="381" class="head">2. Validar · Pydantic + regras</text><text x="383" y="410" class="body">Tipos, recursos, filtros, datas e entidade</text><text x="383" y="433" class="body">Contrato válido não prova intenção correta</text><rect x="365" y="488" width="470" height="98" rx="12" fill="#e7efe8" stroke="#9ab5a3"/><text x="383" y="519" class="head">3. Consultar fontes · Python</text><text x="383" y="548" class="body">Resolver entidades, filtrar e calcular</text><text x="383" y="571" class="body">Chamadas de leitura a fontes oficiais</text><rect x="365" y="625" width="470" height="98" rx="12" fill="#e7efe8" stroke="#9ab5a3"/><text x="383" y="656" class="head">4. Responder</text><text x="383" y="685" class="body">Formatar cálculos ou explicar evidências</text><text x="383" y="708" class="body">Fonte, período e provedor efetivo</text><rect x="25" y="350" width="285" height="120" rx="12" fill="#f5ecd9" stroke="#9ab5a3"/><text x="43" y="381" class="head">Esclarecer</text><text x="43" y="410" class="body">Falta informação ou nome</text><text x="43" y="433" class="body">ambíguo? Perguntar e</text><text x="43" y="456" class="body">aguardar o próximo turno</text><rect x="25" y="590" width="285" height="100" rx="12" fill="#edf0ed" stroke="#9ab5a3"/><text x="43" y="621" class="head">Memória da sessão</text><text x="43" y="650" class="body">LangGraph + SQLite</text><text x="43" y="673" class="body">Filtros e referências válidas</text><rect x="905" y="214" width="305" height="120" rx="12" fill="#edf0ed" stroke="#9ab5a3"/><text x="923" y="245" class="head">Dados oficiais da Câmara</text><text x="923" y="274" class="body">API REST · CSV · páginas</text><text x="923" y="297" class="body">Cache com data de obtenção</text><text x="923" y="320" class="body">Dados faltantes não são zero</text><path d="M600 182V214" class="line "/><path d="M600 312V350" class="line "/><path d="M600 448V488" class="line "/><path d="M600 586V625" class="line "/><path d="M365 399H310" class="line "/><text x="53" y="322" class="small muted">Pedido incompleto → encerra o turno</text><path d="M365 530H333V450H310" class="line dash"/><text x="28" y="515" class="small muted">Resolução ambígua também</text><text x="28" y="537" class="small muted">pode pedir uma escolha.</text><path d="M835 533H1057V334" class="line dash"/><text x="883" y="470" class="small muted">Executor acessa fontes</text><path d="M835 560H1176V605H806V586" class="line "/><text x="905" y="589" class="small muted">Próximo tema, se houver</text><rect x="25" y="764" width="1185" height="86" rx="10" fill="#173e31"/><text x="45" y="795" style="font:700 20px Arial;fill:white">Rotina separada: atualizar_fontes.py · a cada 900 segundos</text><text x="45" y="824" style="font:17px Arial;fill:#e2eee7">Renova um lote das fontes oficiais consultadas, sem chamadas ao modelo de IA.</text></svg>